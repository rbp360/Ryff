name: pipeline
on:
  schedule:
    - cron: '30 6,18 * * *'   # UTC; GitHub may delay runs by minutes
  workflow_dispatch: {}
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_FAST: ${{ vars.MODEL_FAST || 'gemini-2.5-flash' }}
          MODEL_SMART: ${{ vars.MODEL_SMART || 'gemini-2.5-pro' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'bedlamthebandbedlam@gmail.com' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
